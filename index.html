<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ASCII Text Studio - Cyril Rodriguez Edition</title>
  <style>
    :root {
      --bg-color: #0f0b18;
      --card-bg: #181326;
      --accent-color: #a855f7; /* Modern Purple */
      --accent-glow: rgba(168, 85, 247, 0.25);
      --text-color: #f3f4f6;
      --border-color: #2e2640;
      --btn-bg: #211a33;
      --btn-hover: #31284d;
      
      /* Canvas Defaults */
      --canvas-bg: #090710;
      --canvas-text: #c084fc;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 24px;
      max-width: 960px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 12px;
    }

    .header-title-group {
      display: flex;
      flex-direction: column;
    }

    h2 {
      margin: 0;
      font-family: monospace;
      font-size: 24px;
      color: var(--accent-color);
      text-shadow: 0 0 10px var(--accent-glow);
      letter-spacing: 1px;
    }

    .signature {
      font-size: 13px;
      color: #c084fc;
      font-family: monospace;
      margin-top: 4px;
    }

    .external-link {
      color: var(--accent-color);
      background: rgba(168, 85, 247, 0.12);
      border: 1px solid var(--accent-color);
      padding: 6px 12px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.15s ease;
    }

    .external-link:hover {
      background: var(--accent-color);
      color: #000;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .toolbar {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .toolbar-group {
      margin-bottom: 12px;
    }

    .toolbar-group:last-child {
      margin-bottom: 0;
    }

    .group-label {
      font-size: 11px;
      font-weight: 600;
      color: #9ca3af;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn {
      background: var(--btn-bg);
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 15px;
      border-radius: 6px;
      cursor: pointer;
      margin: 2px;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: var(--btn-hover);
      border-color: var(--accent-color);
      color: var(--accent-color);
      box-shadow: 0 0 8px var(--accent-glow);
    }

    .action-btn {
      background: rgba(168, 85, 247, 0.15);
      color: var(--accent-color);
      border-color: var(--accent-color);
      font-family: sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 6px;
    }

    .action-btn:hover {
      background: var(--accent-color);
      color: #000;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .danger-btn {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border-color: #ef4444;
      font-family: sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 6px;
    }

    .danger-btn:hover {
      background: #ef4444;
      color: #fff;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.3);
    }

    .select-dropdown {
      background: var(--btn-bg);
      color: var(--accent-color);
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      vertical-align: middle;
      margin-right: 8px;
    }

    .color-picker {
      vertical-align: middle;
      cursor: pointer;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: transparent;
    }

    .color-btn {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.2);
      display: inline-block;
      cursor: pointer;
      margin-right: 6px;
      vertical-align: middle;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .color-btn:hover {
      transform: scale(1.15);
      border-color: #fff;
    }

    /* Editor Styling */
    #editor {
      width: 100%;
      height: 480px;
      background-color: var(--canvas-bg);
      color: var(--canvas-text);
      font-family: 'Courier New', Courier, monospace;
      font-size: 16px;
      line-height: 20px;
      padding: 16px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-sizing: border-box;
      outline: none;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.8), 0 0 15px rgba(168, 85, 247, 0.1);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    #editor:focus {
      border-color: var(--accent-color);
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.8), 0 0 10px var(--accent-glow);
    }

    /* Pixel-Locked Grid Overlay */
    #editor.grid-active {
      background-image: linear-gradient(to right, rgba(255, 255, 255, 0.08) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 9.6px 20px;
      background-position: 16px 16px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-title-group">
      <h2>⚡ ASCII TEXT STUDIO</h2>
      <div class="signature">Created by Cyril Rodriguez (•_•)</div>
    </div>
    <a href="https://symbl.cc/" target="_blank" class="external-link">🌐 Open SYMBL Library ↗</a>
  </div>

  <div class="toolbar">
    <div class="toolbar-group">
      <div class="group-label">Text Color (Highlight text to apply)</div>
      <input type="color" id="textColor" class="color-picker" value="#c084fc" onchange="applyColor(this.value)">
      <span class="color-btn" style="background: #000000; border-color: #ffffff;" onmousedown="event.preventDefault(); applyColor('#000000')"></span>
      <span class="color-btn" style="background: #a855f7;" onmousedown="event.preventDefault(); applyColor('#a855f7')"></span>
      <span class="color-btn" style="background: #3b82f6;" onmousedown="event.preventDefault(); applyColor('#3b82f6')"></span>
      <span class="color-btn" style="background: #06b6d4;" onmousedown="event.preventDefault(); applyColor('#06b6d4')"></span>
      <span class="color-btn" style="background: #10b981;" onmousedown="event.preventDefault(); applyColor('#10b981')"></span>
      <span class="color-btn" style="background: #f59e0b;" onmousedown="event.preventDefault(); applyColor('#f59e0b')"></span>
      <span class="color-btn" style="background: #ffffff;" onmousedown="event.preventDefault(); applyColor('#ffffff')"></span>
    </div>

    <div class="toolbar-group">
      <div class="group-label">Arrows & Symbols</div>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('→')">→</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('←')">←</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('↑')">↑</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('↓')">↓</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('►')">►</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('◄')">◄</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('▲')">▲</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('▼')">▼</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('★')">★</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('☆')">☆</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('✦')">✦</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('✧')">✧</button>
    </div>

    <div class="toolbar-group">
      <div class="group-label">Shading & Blocks</div>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('█')">█</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('▓')">▓</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('▒')">▒</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('░')">░</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('▀')">▀</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('▄')">▄</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('▌')">▌</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('▐')">▐</button>
    </div>

    <div class="toolbar-group">
      <div class="group-label">Box Drawing / Borders</div>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('─')">─</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('│')">│</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('┌')">┌</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('┐')">┐</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('└')">└</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('┘')">┘</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('├')">├</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('┤')">┤</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('┬')">┬</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('┴')">┴</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('┼')">┼</button>
    </div>

    <div class="toolbar-group">
      <div class="group-label">Braille Patterns</div>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('⣿')">⣿</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('⣾')">⣾</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('⣽')">⣽</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('⣻')">⣻</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('⢿')">⢿</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('⡿')">⡿</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('⣟')">⣟</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('⣯')">⣯</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('⠁')">⠁</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('⠃')">⠃</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('⠇')">⠇</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('⠏')">⠏</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('⠟')">⠟</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('⠿')">⠿</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('⠄')">⠄</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('⠆')">⠆</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('⠔')">⠔</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('⠢')">⠢</button>
      <button class="btn" onmousedown="event.preventDefault(); insertChar('⢀')">⢀</button>
    </div>

    <div class="toolbar-group" style="margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border-color);">
      <div class="group-label">Tools & Canvas Controls</div>
      <button class="btn action-btn" onclick="saveAsTxt()">💾 Save as .txt</button>
      <button class="btn action-btn" onclick="copyToClipboard()">📋 Copy Artwork</button>
      <button class="btn action-btn" onclick="toggleGrid()">📐 Toggle Grid</button>
      
      <select class="select-dropdown" onchange="changeTheme(this.value)">
        <option value="dark">Theme: Deep Purple</option>
        <option value="cyber">Theme: Cyber Blue</option>
        <option value="matrix">Theme: Matrix Green</option>
        <option value="paper">Theme: Paper White</option>
      </select>

      <button class="btn danger-btn" onclick="clearCanvas()">🧹 Clear Canvas</button>
    </div>
  </div>

  <div id="editor" contenteditable="true" spellcheck="false"></div>

  <script>
    function insertChar(char) {
      document.getElementById('editor').focus();
      document.execCommand('insertText', false, char);
    }

    function applyColor(color) {
      document.getElementById('editor').focus();
      document.execCommand('foreColor', false, color);
      document.getElementById('textColor').value = color;
    }

    function saveAsTxt() {
      const text = document.getElementById('editor').innerText;
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'ascii-art.txt';
      link.click();
      URL.revokeObjectURL(link.href);
    }

    function copyToClipboard() {
      const text = document.getElementById('editor').innerText;
      navigator.clipboard.writeText(text).then(() => {
        alert('Artwork copied to clipboard!');
      }).catch(err => {
        alert('Failed to copy text: ' + err);
      });
    }

    function toggleGrid() {
      document.getElementById('editor').classList.toggle('grid-active');
    }

    function clearCanvas() {
      if (confirm('Are you sure you want to clear the canvas?')) {
        document.getElementById('editor').innerHTML = '';
      }
    }

    function changeTheme(theme) {
      const editor = document.getElementById('editor');
      if (theme === 'dark') {
        editor.style.backgroundColor = '#090710';
        editor.style.color = '#c084fc';
      } else if (theme === 'cyber') {
        editor.style.backgroundColor = '#0a1128';
        editor.style.color = '#38bdf8';
      } else if (theme === 'matrix') {
        editor.style.backgroundColor = '#001100';
        editor.style.color = '#34d399';
      } else if (theme === 'paper') {
        editor.style.backgroundColor = '#f8f9fa';
        editor.style.color = '#111111';
      }
    }
  </script>

</body>
</html>
